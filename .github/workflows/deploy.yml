name: Deploy API to Production VPS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint & Fix
        run: npm run lint:fix

      - name: Test CI
        env:
          NODE_ENV: test
          DB_DIALECT: sqlite
          DB_STORAGE: ":memory:"
          JWT_SECRET: "test_jwt_secret_key_minimum_32_characters_long"
        run: npm run test:ci

      - name: Security Audit
        run: npm audit --audit-level=moderate

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    environment: PRODUCTION_VPS
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install production dependencies
        run: npm ci --production

      - name: Deploy to VPS
        env:
          VPS_USER: kkpusid
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_PORT: 2222
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Port: $VPS_PORT"
          echo "Username: $VPS_USER"
          echo "Host: kkpus.id"

          # SSH connection script
          cat <<'SSHEOF' | ssh -p $VPS_PORT -i ~/.ssh/id_rsa kkpus.id@kkpus.id
            cd /home/kkpus.id/api.kkpus.id
            git fetch origin master
            git reset --hard origin/master
            npm install --production

            # Restart PM2 if available
            if command -v pm2 &> /dev/null; then
              pm2 reload app || pm2 restart app
            else
              npx pm2 reload app || npx pm2 restart app
            fi
          SSHEOF
