name: Deploy API to Local Host

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment:
      name: LOCAL_HOST
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci --production
      
    - name: Debug and Deploy Locally
      run: |
        echo "Port: '3445'"
        echo "Username: 'admin'"
        echo "Host: 'localhost'"
        
        ssh -p 3445 -o StrictHostKeyChecking=no admin@localhost << 'EOF'
          # Load NVM and user profile paths
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
          export PATH="$PATH:/usr/local/bin:$HOME/.npm-global/bin"
          
          cd /d/kkpus/api.kkpus.id
          git fetch origin master
          git reset --hard origin/master
          npm install --production
          
          # Restart PM2 using direct command or npx fallback
          if command -v pm2 &> /dev/null; then
            pm2 reload app || pm2 restart app
          else
            npx pm2 reload app || npx pm2 restart app
          fi
        EOF