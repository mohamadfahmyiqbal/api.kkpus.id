name: Deploy API to Production VPS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: koperasi
          MYSQL_USER: kkpusid
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test CI
        env:
          NODE_ENV: test
          DB_DIALECT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: koperasi
          DB_USER: kkpusid
          DB_PASSWORD: test_password
          JWT_SECRET: "test_jwt_secret_key_minimum_32_characters_long"
        run: npm run test:ci

      - name: Security Audit
        run: npm audit --audit-level=critical || true

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER || secrets.VPS_USERNAME || 'kkpusid' }}
          VPS_HOST: ${{ secrets.VPS_HOST || 'kkpus.id' }}
          VPS_PORT: ${{ secrets.VPS_PORT || 2222 }}
        run: |
          echo "Port: $VPS_PORT"
          echo "Username: $VPS_USER"
          echo "Host: $VPS_HOST"

          mkdir -p ~/.ssh
          ssh-keyscan -p $VPS_PORT $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -p $VPS_PORT -o StrictHostKeyChecking=no $VPS_USER@$VPS_HOST << 'EOF'
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$HOME/.profile" ] && \. "$HOME/.profile"
            [ -s "$HOME/.bashrc" ] && \. "$HOME/.bashrc"
            export PATH="$HOME/.local/bin:$HOME/.npm-global/bin:/usr/local/bin:$PATH"

            DEPLOY_DIR=""
            if [ -d "/var/www/api.kkpus.id" ]; then
              DEPLOY_DIR="/var/www/api.kkpus.id"
            elif [ -d "/home/kkpus.id/api.kkpus.id" ]; then
              DEPLOY_DIR="/home/kkpus.id/api.kkpus.id"
            else
              DEPLOY_DIR="/var/www/api.kkpus.id"
            fi

            cd "$DEPLOY_DIR"
            git fetch origin master
            git reset --hard origin/master
            npm install --production

            if command -v pm2 &> /dev/null; then
              pm2 reload app || pm2 restart app
            else
              npx pm2 reload app || npx pm2 restart app
            fi
          EOF
