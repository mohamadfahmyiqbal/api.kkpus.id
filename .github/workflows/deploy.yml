name: Deploy API to Production VPS

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: koperasi
          MYSQL_USER: kkpusid
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test CI
        env:
          NODE_ENV: test
          DB_DIALECT: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: koperasi
          DB_USER: kkpusid
          DB_PASSWORD: test_password
          JWT_SECRET: "test_jwt_secret_key_minimum_32_characters_long"
        run: npm run test:ci

      - name: Security Audit
        run: npm audit --audit-level=moderate

  deploy:
    needs: qa
    runs-on: ubuntu-latest
    environment: PRODUCTION_VPS
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install production dependencies
        run: npm ci --production

      - name: Deploy to VPS
        env:
          VPS_USER: kkpusid
          VPS_PASS: ${{ secrets.VPS_PASS }}
          VPS_PORT: 2222
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          echo "Port: $VPS_PORT"
          echo "Username: $VPS_USER"
          echo "Host: kkpus.id"

          # SSH connection script
          ssh -p $VPS_PORT -i ~/.ssh/id_rsa kkpus.id@kkpus.id 'echo "Connected to VPS"'
